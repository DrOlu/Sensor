name: Notify Multica on Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to notify about'
        required: false
        default: ''
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Multica autopilot
        env:
          WEBHOOK_URL: https://multica.ai/api/webhooks/autopilots/awt_JlRNAtYk1QnYdEI9Sr32LWv9kw4ASiXJYBUKQVQFGHc
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          python3 -c "
          import json, urllib.request, os
          payload = json.dumps({
            'action': 'published',
            'release': {'tag_name': os.environ.get('TAG_NAME', ''), 'draft': False, 'prerelease': False},
            'repository': {
              'full_name': os.environ.get('GITHUB_REPOSITORY', ''),
              'name': os.environ.get('GITHUB_REPOSITORY', '').split('/', 1)[-1] if '/' in os.environ.get('GITHUB_REPOSITORY', '') else ''
            }
          }).encode()
          req = urllib.request.Request(os.environ['WEBHOOK_URL'], data=payload, headers={'Content-Type': 'application/json'})
          urllib.request.urlopen(req)
          "
