name: Self-Heal Critical Files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'DrOlu'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${ secrets.RELEASE_TOKEN }
          fetch-depth: 0

      - name: Restore critical files
        continue-on-error: true
        run: |
          set +e
          git config user.name "Sensor Heal Bot"
          git config user.email "sensor-bot@hyperspace.ng"
          CHANGED=false

          # sync-upstream.yml — restore from embedded base64 (no git history needed)
          if [ ! -f ".github/workflows/sync-upstream.yml" ]; then
            echo "MISSING: sync-upstream.yml"
            cat > /tmp/sync.b64 << 'SYNCB64'

SYNCB64
            base64 -d /tmp/sync.b64 > .github/workflows/sync-upstream.yml
            echo "Restored sync-upstream.yml from embedded content"
            CHANGED=true
          fi

          # notify-multica-release.yml — restore from embedded base64
          if [ ! -f ".github/workflows/notify-multica-release.yml" ]; then
            echo "MISSING: notify-multica-release.yml"
            cat > /tmp/notify.b64 << 'NOTIFYB64'

NOTIFYB64
            base64 -d /tmp/notify.b64 > .github/workflows/notify-multica-release.yml
            echo "Restored notify-multica-release.yml from embedded content"
            CHANGED=true
          fi

          # build.yml patch step — restore from latest tag if missing
          if ! grep -q "Apply Sensor-specific patches" .github/workflows/build.yml 2>/dev/null; then
            LATEST_TAG=$(git tag --list 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            [ -n "$LATEST_TAG" ] && git show "$LATEST_TAG:.github/workflows/build.yml" > .github/workflows/build.yml 2>/dev/null && CHANGED=true
            echo "Restored build.yml from ${LATEST_TAG:-unknown}"
          fi

          # package.json shim — restore from latest tag if missing
          if ! grep -q "useSensorMonacoTheme" package.json 2>/dev/null; then
            LATEST_TAG=$(git tag --list 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            [ -n "$LATEST_TAG" ] && git show "$LATEST_TAG:package.json" > package.json 2>/dev/null && CHANGED=true
            echo "Restored package.json from ${LATEST_TAG:-unknown}"
          fi

          # Fix netcatty in locales
          if grep -rql "netcatty" application/i18n/locales/ 2>/dev/null; then
            find application/i18n/locales -name "*.ts" | xargs sed -i \
              -e 's/launch netcatty from/launch Sensor from/g' \
              -e 's/netcatty-external/sensor-external/g' 2>/dev/null || true
            CHANGED=true
          fi

          if [ "$CHANGED" = "true" ]; then
            git add -A
            git diff --cached --quiet || git commit -m "fix(self-heal): restore critical Sensor files"
            git push origin main || true
          else
            echo "All critical files present."
          fi
